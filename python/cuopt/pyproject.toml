[build-system]
build-backend = "scikit_build_core.build"
requires = [
    "scikit-build-core[pyproject]>=0.11.0",
    "cython>=3.0.3",
    "cmake>=3.30",
    "ninja",
] # RAPIDS-free build: plain scikit-build-core, no rapids-build-backend.

[project]
name = "cuopt"
dynamic = ["version"]
description = "cuOpt - GPU Combinatorial Optimization"
readme = { file = "README.md", content-type = "text/markdown" }
authors = [
    { name = "NVIDIA Corporation" },
]
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "libcuopt==26.6.*",
    "numpy>=1.23.5,<3.0",
    "pandas>=2.0",
    "pyyaml>=6.0.0",
    "scipy>=1.14.1",
] # RAPIDS-free: LP/MILP/QP need no RAPIDS packages; routing needs the
# `routing` extra below (cudf retained per design — see
# docs/dev/rapids_removal_mvp_results.md).
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
routing = [
    "cudf-cu12==26.6.*",
    "cupy-cuda12x>=13.6.0,!=14.0.0,!=14.1.0",
    "numba-cuda>=0.22.1",
    "numba>=0.60.0,<0.65.0",
]
test = [
    "numpy>=1.23.5,<3.0",
    "pytest-cov",
    "pytest-rerunfailures",
    "pytest<9.0",
]

[project.urls]
Homepage = "https://docs.nvidia.com/cuopt/introduction.html"
Source = "https://github.com/nvidia/cuopt"

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint.isort]
known-first-party = [
    "cuopt",
]

[tool.ruff.lint.isort.sections]
rapids = [
    "cudf",
    "pylibraft",
    "rmm",
]

[tool.pydistcheck]
select = [
    "distro-too-large-compressed",
]

# PyPI hard limit is 1GiB, but try to keep this as small as possible
max_allowed_size_compressed = '55Mi'

[tool.pytest.ini_options]
testpaths = ["cuopt/tests"]

[tool.scikit-build]
build-dir = "build/{wheel_tag}"
cmake.build-type = "Release"
cmake.version = "CMakeLists.txt"
minimum-version = "build-system.requires"
ninja.make-fallback = false
sdist.reproducible = true
wheel.packages = ["cuopt"]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "cuopt/VERSION"
regex = "(?P<value>.*)"

