[build-system]
build-backend = "scikit_build_core.build"
requires = [
    "scikit-build-core[pyproject]>=0.11.0",
    "cmake>=3.30",
    "ninja",
] # RAPIDS-free build: plain scikit-build-core, no rapids-build-backend.

[project]
name = "libcuopt"
dynamic = ["version"]
description = "cuOpt - GPU Optimizer (C++)"
readme = { file = "README.md", content-type = "text/markdown" }
authors = [
    { name = "NVIDIA Corporation" },
]
license = "Apache-2.0"
requires-python = ">=3.11"
classifiers = [
    "Intended Audience :: Developers",
    "Topic :: Database",
    "Topic :: Scientific/Engineering",
    "Programming Language :: C++",
    "Environment :: GPU :: NVIDIA CUDA",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
] # RAPIDS-free: libcuopt.so links no RAPIDS runtime libraries; CUDA math
# libraries resolve via RPATH (system CUDA toolkit or nvidia-*-cu12 wheels).

[project.urls]
Homepage = "https://docs.nvidia.com/cuopt/introduction.html"
Source = "https://github.com/nvidia/cuopt"

[project.entry-points."cmake.prefix"]
libcuopt = "libcuopt"

[project.scripts]
cuopt_cli = "libcuopt._cli_wrapper:main"
cuopt_grpc_server = "libcuopt._grpc_server_wrapper:main"

[tool.pydistcheck]
select = [
    # note: max_allowed_size_compressed is set as a command-line arg
    "distro-too-large-compressed",
]

[tool.scikit-build]
build-dir = "build/{wheel_tag}"
cmake.define.CMAKE_INSTALL_LIBDIR = "lib64"
cmake.build-type = "Release"
cmake.version = "CMakeLists.txt"
minimum-version = "build-system.requires"
ninja.make-fallback = false
sdist.reproducible = true
wheel.packages = ["libcuopt"]
wheel.install-dir = "libcuopt"
wheel.py-api = "py3"

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "libcuopt/VERSION"
regex = "(?P<value>.*)"

